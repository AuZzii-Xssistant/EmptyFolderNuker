name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Windows build as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Set up Rust MSVC
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Install browser test tools
        run: |
          npm install --prefix tests --no-save --package-lock=false playwright@1.62.1
          node tests/node_modules/playwright/cli.js install chromium --only-shell
      - name: Test and build Windows executable
        env:
          RUST_TEST_THREADS: '1'
        run: .\build.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: EmptyFolderNuker-Windows-x64
          path: |
            builds/EmptyFolderNuker.exe
            builds/BUILDINFO.txt
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: EmptyFolderNuker-Windows-x64
          path: release
      - name: Verify and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          info=release/BUILDINFO.txt
          version=$(tr -d '\r' < "$info" | awk '/^version / {print $3}')
          expected=$(tr -d '\r' < "$info" | awk '/^sha256 / {print $3}')
          actual=$(sha256sum release/EmptyFolderNuker.exe | cut -d' ' -f1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$actual" == "$expected" ]]
          grep -Eq "^commit[[:space:]]*:[[:space:]]*${GITHUB_SHA:0:7}[[:xdigit:]]*([[:space:]]|$)" "$info"

          build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          tag="v$version-build.$build"
          printf 'Portable Windows x64 build of Empty Folder Nuker %s.\n\nSHA-256: `%s`\n\n[Build and test results](%s/%s/actions/runs/%s)\n' \
            "$version" "$actual" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          gh release create "$tag" release/EmptyFolderNuker.exe "$info" \
            --target "$GITHUB_SHA" --title "EmptyFolderNuker v$version (build $build)" \
            --latest --notes-file release-notes.md --generate-notes
