name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Set up Rust MSVC
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - name: Install browser test tools
        run: |
          npm install --prefix tests --no-save --package-lock=false playwright@1.62.1
          node tests/node_modules/playwright/cli.js install chromium --only-shell
      - name: Test and build Windows executable
        env:
          RUST_TEST_THREADS: '1'
        run: .\build.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: EmptyFolderNuker-Windows-x64
          path: |
            builds/EmptyFolderNuker.exe
            builds/BUILDINFO.txt
          if-no-files-found: error
