name: Feature request
description: Suggest an improvement to Empty Folder Nuker
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain what is difficult today and how often it comes up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the change you would like to see.
    validations:
      required: true
