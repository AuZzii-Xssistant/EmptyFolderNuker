name: Bug report
description: Report a problem with Empty Folder Nuker
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Issues are public. Remove private folder paths and personal information from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: App version or build
      description: See About for the version. Include the build date or download link if available.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11, 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the scan options and folder layout with sample names if relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or errors
      description: Attach anything that helps reproduce the issue.
